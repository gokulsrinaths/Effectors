<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Structure Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0d1526; overflow: hidden; }
  #viewer { width: 100%; height: 100%; }
  #msg {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #7a9abf;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="viewer"></div>
<div id="msg">Waiting for structures…</div>
<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
<script>
window.addEventListener('message', function(e) {
  var data = e.data;
  if (!data || !data.queryPdb || !data.matchPdb) return;

  document.getElementById('msg').style.display = 'none';

  var viewer = $3Dmol.createViewer(document.getElementById('viewer'), {
    backgroundColor: '#0d1526',
  });

  viewer.addModel(data.queryPdb, 'pdb');
  viewer.setStyle({ model: 0 }, { cartoon: { color: '#00d4ff' } });

  viewer.addModel(data.matchPdb, 'pdb');
  viewer.setStyle({ model: 1 }, { cartoon: { color: '#f0a000' } });

  viewer.zoomTo();
  viewer.render();
});
</script>
</body>
</html>
